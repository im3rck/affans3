# RAG Configuration
rag:
  chunk_size: 1000
  chunk_overlap: 200
  top_k_results: 5
  rerank_top_k: 3
  hybrid_search:
    vector_weight: 0.7
    bm25_weight: 0.3

# Agent Configuration
agent:
  max_iterations: 10
  verbose: true
  allow_delegation: false

# Data Sources
data_sources:
  pdfs:
    - "HR & Benefits FAQ.pdf"
    - "IT & Tech Support.pdf"
    - "Workplace & Operations FAQ.pdf"
  csv:
    - "amazon.csv"

# Knowledge Domains
knowledge_domains:
  - name: "HR & Benefits"
    description: "Pay stubs, PTO/vacation, 401k, leave of absence, W-2, holidays, personal info updates, employment verification, policy violations"
  - name: "IT & Tech Support"
    description: "VPN, password reset, BitLocker, browser requirements, peripheral devices, shared drive access, mobile device setup, laptop issues, phishing, ServiceNow tickets"
  - name: "Workplace & Operations"
    description: "Conference room booking, office supplies, building maintenance, lost property, desk moves, visitor registration, safety hazards, evacuation plans, access badges, catering"
  - name: "Product Information"
    description: "Amazon product catalog, reviews, ratings, pricing, discounts"
